<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Font To Bitmap Converter</title>
    <meta name="description" content="Tool for converting fonts into bitmap fonts"/>
    <meta name="keywords" content="bitmap, bitmap font, font to bitmap, ttf bitmap, woff bitmap"/>
    <script defer type="module" src="/src/main.js"></script>
    <style>
        body {
            background: #1D3557 !important;
            font-size: 13px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #preview {
            border: 5px solid #222C42;
            color: #fff;
            border-radius: 10px;
            padding: 15px;
            -webkit-font-smoothing: none;
        }

        /* Preview only, never captured in the export (it lives outside #preview) */
        #sample-preview {
            -webkit-font-smoothing: none;
        }

        /* A long sample must wrap instead of running off both sides of the page */
        #sample-preview .line {
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type=number], input[type=text] {
            max-height: 60px !important;
        }

        body.downloading {
            background: transparent;
        }

        body.downloading #preview {
            border: 0 !important;
            padding: 0 !important;
        }

        /* Single source of truth for the room the tools cluster needs */
        :root {
            --characters-tools-width: 215px;
        }

        #characters {
            /* min-height, not height, so dragging the resize handle still works */
            min-height: 90px;
            padding-right: var(--characters-tools-width);
        }

        /* Minimal text controls floating over the top right corner of the textarea.
           Only the links take pointer events, so clicking the corner or typing in
           the textarea still works */
        .characters-tools {
            position: absolute;
            top: 4px;
            right: 8px;
            z-index: 3;
            font-size: 11px;
            line-height: 1;
            pointer-events: none;
        }

        .characters-tools a {
            font-size: 11px;
        }

        .characters-tools a,
        .characters-tools .dropdown {
            pointer-events: auto;
        }

        /* No room for the counter on a narrow screen, so it goes and the
           reserved padding shrinks with it */
        @media (max-width: 575px) {
            :root {
                --characters-tools-width: 165px;
            }

            .characters-count {
                display: none;
            }
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
    <link href="//cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body draggable="false" style="user-select: none;" x-data="converter"
      @dragover.prevent @drop="onDrop($event)">
<style x-text="css"></style>
<div class="container bg-grey mt-3" x-cloak>
    <div class="row">
        <div class="col d-flex align-items-center flex-wrap" style="color: #fff; margin-bottom: 3px; font-size: 13px;">
            <b>Upload:</b>
            <div class="form-check form-check-inline ms-1">
                <input x-model="inputType" class="form-check-input" type="radio" name="inputType_fontUrl" id="inputType_fontUrl" value="fontUrl" checked>
                <label class="form-check-label" for="inputType_fontUrl">
                    From URL
                </label>
            </div>
            <div class="form-check form-check-inline">
                <input x-model="inputType" class="form-check-input" type="radio" name="inputType_file" id="inputType_file" value="file">
                <label class="form-check-label" for="inputType_file">
                    From File
                </label>
            </div>
            <div class="form-check form-switch ms-auto">
                <input class="form-check-input" x-model="advanced" type="checkbox" role="switch" id="advanced">
                <label class="form-check-label" for="advanced">Advanced options</label>
            </div>
        </div>
    </div>
    <div x-show="inputType==='file'" class="row">
        <div class="col">
            <div class="mb-3">
                <input class="form-control" x-on:change="onFile($event)" type="file" id="file">
            </div>
        </div>
    </div>
    <div x-show="inputType==='fontUrl'" class="row">
        <div class="col">
            <div class="form-floating mb-3">
                <input type="text" x-model.debounce.100ms="fontUrl" list="fontsList"
                       onclick="this.focus();this.select()"
                       class="form-control form-control-sm border-0" id="font">
                <label for="font">Font URL</label>
            </div>
            <datalist id="fontsList">
                <template x-for="font in fontsList">
                    <option x-text="`${font.name}`" :value="font.url"></option>
                </template>
            </datalist>
        </div>
        <div class="col" x-show="uniqueFonts().length > 1">
            <div class="form-floating">
                <select class="form-select" id="floatingSelect" x-model="fontIndex">
                    <template x-for="(f, index) in uniqueFonts">
                        <option x-text="`${f.name} [${f.style}] [${f.weight}]`" :value="index"
                                style="text-transform: capitalize;"></option>
                    </template>
                </select>
                <label for="floatingSelect">Font variant</label>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <div class="form-floating mb-3">
                <input type="number" min="1" x-model="perRow" class="form-control form-control-sm border-0" id="perRow">
                <label for="perRow">Per row</label>
            </div>
        </div>
        <div class="col">
            <div class="form-floating mb-3">
                <input type="number" x-model="gridWidth" class="form-control form-control-sm border-0" id="gridWidth">
                <label for="gridWidth">Grid width</label>
            </div>
        </div>
        <div class="col">
            <div class="form-floating mb-3">
                <input type="number" x-model="gridHeight" class="form-control form-control-sm border-0" id="gridHeight">
                <label for="gridHeight">Grid height</label>
            </div>
        </div>
        <div class="col">
            <div class="form-floating mb-3">
                <input type="number" x-model="fontSize" class="form-control form-control-sm border-0" id="fontSize">
                <label for="fontSize">Font size</label>
            </div>
        </div>
    </div>

    <div class="form-floating mb-3 position-relative">
            <textarea x-model="characters" class="form-control form-control-sm border-0" id="characters"></textarea>
        <label for="characters">Characters</label>
        <div class="characters-tools d-flex align-items-center gap-2">
            <span class="characters-count text-muted"
                  x-text="`${uniqueCharacters().length} / ${characters.length}`"></span>
            <a href="#" id="removeDuplicates" class="link-secondary text-decoration-none"
               @click.prevent="removeDuplicates()">Remove duplicates</a>
            <div class="dropdown">
                <a href="#" id="presetsDropdown" class="link-secondary text-decoration-none dropdown-toggle"
                   role="button" data-bs-toggle="dropdown" aria-expanded="false">Presets</a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="presetsDropdown">
                    <template x-for="name in presetNames()">
                        <li><a class="dropdown-item" href="#" @click.prevent="setPreset(name)" x-text="name"></a></li>
                    </template>
                    <li>
                        <a class="dropdown-item" href="#" id="allGlyphs"
                           :class="glyphsAvailable() ? '' : 'disabled'"
                           :aria-disabled="glyphsAvailable() ? 'false' : 'true'"
                           :tabindex="glyphsAvailable() ? false : '-1'"
                           @click.prevent="useAllGlyphs()"
                           x-text="glyphsLoading ? 'Reading glyphs...' : 'All glyphs in font'"></a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#" @click.prevent="clearCharacters()">Clear</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card p-2 px-3 border-0">
        <div class="">
            <div class="float-start">
                <div class="form-check form-switch form-control-sm">
                    <input class="form-check-input" x-model="options.outline" type="checkbox" role="switch"
                           id="outline">
                    <label class="form-check-label" for="outline">Outline</label>
                </div>
            </div>
            <div class="float-start ms-3">
                <div class="form-check form-switch form-control-sm">
                    <input class="form-check-input" x-model="options.antialiasing" type="checkbox" role="switch"
                           id="antialiasing">
                    <label class="form-check-label" for="antialiasing">Antialiasing</label>
                </div>
            </div>
            <div class="float-start ms-3" x-show="options.antialiasing">
                <div class="form-check form-switch form-control-sm">
                    <input class="form-check-input" x-model="options.subpixel" type="checkbox" role="switch"
                           id="subpixel">
                    <label class="form-check-label" for="subpixel">Subpixel AA</label>
                </div>
            </div>
            <div class="float-start ms-3">
                <div class="form-check form-switch form-control-sm">
                    <input class="form-check-input" x-model="options.italic" type="checkbox" role="switch"
                           id="italic">
                    <label class="form-check-label" for="italic">Italic</label>
                </div>
            </div>
            <div class="float-start ms-3">
                <div class="form-check form-switch form-control-sm">
                    <input class="form-check-input" x-model="options.centered" type="checkbox" role="switch"
                           id="centered">
                    <label class="form-check-label" for="centered">Centered</label>
                </div>
            </div>
            <div class="float-start ms-3">
                <div class="form-check form-switch form-control-sm">
                    <input class="form-check-input" x-model="options.showGrid" type="checkbox" role="switch"
                           id="showGrid">
                    <label class="form-check-label" for="showGrid">Show grid</label>
                </div>
            </div>
        </div>
    </div>

    <div class="card p-2 px-3 border-0 mt-2" x-show="advanced">
        <div class="d-flex align-items-center gap-3 flex-wrap form-control-sm">
            <div class="d-flex align-items-center gap-1">
                <label for="colorText">Text</label>
                <input type="color" class="form-control form-control-color" id="colorText" x-model="colors.text">
            </div>
            <!-- x-if, not x-show: Bootstrap's .d-flex is display:flex !important,
                 so it would win over the inline display:none x-show writes -->
            <template x-if="options.outline">
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center gap-1">
                        <label for="colorOutline">Outline</label>
                        <input type="color" class="form-control form-control-color" id="colorOutline" x-model="colors.outline">
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <label for="outlineWidth">Outline width</label>
                        <input type="number" min="1" max="4" style="width: 70px;" class="form-control" id="outlineWidth" x-model="outlineWidth">
                    </div>
                </div>
            </template>
            <div class="d-flex align-items-center gap-1">
                <label for="colorBackground">Background</label>
                <input type="color" class="form-control form-control-color" id="colorBackground" x-model="colors.background">
                <button class="btn btn-sm btn-outline-secondary" @click="colors.background = ''">Transparent</button>
            </div>
            <div class="d-flex align-items-center gap-1">
                <label for="exportScale">Export scale</label>
                <select class="form-select form-select-sm" style="width: 80px;" id="exportScale" x-model.number="exportScale">
                    <option value="1">1x</option>
                    <option value="2">2x</option>
                    <option value="4">4x</option>
                </select>
            </div>
        </div>
    </div>

    <!-- its own block on the page background, not buried in the white card
         where a borderless white input is invisible. The preview mode toggle
         sits next to it, the sample text is what it switches to -->
    <div class="row mt-2 align-items-center" x-show="advanced">
        <div class="col">
            <div class="form-floating">
                <input type="text" x-model="sampleText" class="form-control form-control-sm border-0" id="sampleText" placeholder="Sample">
                <label for="sampleText">Sample text (preview only, not exported)</label>
            </div>
        </div>
        <!-- col-auto, not a d-flex wrapper: display utilities are !important
             and would beat the inline display:none that x-show writes -->
        <div class="col-auto" x-show="!loading && font() && !error">
            <div class="btn-group btn-group-sm" role="group" aria-label="Preview mode">
                <button type="button" id="previewModeBitmap" class="btn"
                        :class="previewMode === 'bitmap' ? 'btn-light' : 'btn-outline-light'"
                        @click="previewMode = 'bitmap'">Bitmap</button>
                <button type="button" id="previewModeSample" class="btn"
                        :class="previewMode === 'sample' ? 'btn-light' : 'btn-outline-light'"
                        @click="previewMode = 'sample'">Sample text</button>
            </div>
        </div>
    </div>

    <div class="text-center mt-3">
        <button class="btn btn-success" style="font-weight: 800;" @click="download()">DOWNLOAD BITMAP FONT</button>
        <div class="dropdown" style="display: inline-block;" >
            <button class="btn btn-success dropdown-toggle" style="height: 38px;" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                Export
            </button>
            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                <li><a class="dropdown-item" @click="exportCode('bundle')">ZIP bundle (PNG + BMFont)</a></li>
                <li><a class="dropdown-item" @click="exportCode('bmfontJson')">BMFont (JSON)</a></li>
                <li><a class="dropdown-item" @click="exportCode('bmfontText')">BMFont (.fnt)</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" @click="exportCode('construct')">Construct 3</a></li>
                <li><a class="dropdown-item" @click="exportCode('kaplay')">KaPlay</a></li>
            </ul>
        </div>
    </div>

    <div style="margin-top: 15px; display: flex; justify-content: center;">
        <div x-show="loading" class="text-white">
            <div class="spinner-border text-light" role="status">
                <span class="sr-only"></span>
            </div>
        </div>
        <div x-show="!loading">
            <template x-if="font() && !error">
                <div>
                    <div x-show="previewMode === 'bitmap'" x-html="html"
                         :style="`font-family: '${font()?.name}'; font-weight: ${font()?.weight}; font-style: ${font()?.style};`"></div>
                    <div x-show="previewMode === 'sample'" id="sample-preview" x-html="sampleHtml"
                         :style="`font-family: '${font()?.name}'; font-weight: ${font()?.weight}; font-style: ${font()?.style};`"></div>
                </div>
            </template>
            <template x-if="error">
                <div class="alert alert-danger mb-0">
                    Failed to fetch a font from provided URL.
                </div>
            </template>
        </div>
    </div>
</div>

<script src="//cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="/google-fonts.js"></script>
</body>
</html>
